name: Terraform CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: "🚀 Terraform Validation"
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 👋 STEP 0 - Runner Created
      # ==========================================================
      - name: 👋 Welcome to the Runner
        run: |
          echo "================================================="
          echo "🚀 GITHUB ACTIONS TRAINING MODE"
          echo ""
          echo "GitHub interpretó este archivo YAML."
          echo "Luego creó un Runner Ubuntu completamente limpio."
          echo ""
          echo "Estado inicial:"
          echo "✔ Ubuntu"
          echo "❌ Repositorio"
          echo "❌ Terraform"
          echo ""
          echo "Comencemos a preparar el Runner..."
          echo "================================================="

      # ==========================================================
      # 📥 STEP 1 - Checkout Repository
      # ==========================================================
      #
      # ¿Qué es?
      # Una GitHub Action oficial.
      #
      # Owner: actions
      # Repo : checkout
      # Versión: v4
      #
      # El Runner descarga el repositorio de la Action
      # y ejecuta el programa que vive dentro.
      #
      # Ese programa descarga ESTE repositorio
      # al workspace del Runner.
      # ==========================================================
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📥 STEP 1 - CHECKOUT"
          echo ""
          echo "GitHub indicó al Runner:"
          echo "  Ejecuta actions/checkout@v4"
          echo ""
          echo "El Runner descargó la Action."
          echo "Luego ejecutó el programa de esa Action."
          echo "Ese programa descargó ESTE repositorio."
          echo "================================================="

      # ==========================================================
      # 📦 STEP 2 - Setup Terraform
      # ==========================================================
      #
      # ¿Qué es?
      # Una GitHub Action oficial de HashiCorp.
      #
      # Owner: hashicorp
      # Repo : setup-terraform
      # Versión: v3
      #
      # Responsabilidad:
      # Instalar Terraform dentro del Runner.
      # ==========================================================
      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📦 STEP 2 - SETUP TERRAFORM"
          echo ""
          echo "El Runner ejecutó hashicorp/setup-terraform."
          echo "Terraform quedó instalado."
          echo "Todavía NO hemos ejecutado Terraform."
          echo "================================================="

      # ==========================================================
      # 📍 STEP 3 - Working Directory
      # ==========================================================
      - name: 📍 Show current directory
        run: pwd

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📍 STEP 3 - WORKING DIRECTORY"
          echo ""
          echo "Todos los comandos 'run:' se ejecutan"
          echo "desde este directorio."
          echo "================================================="

      # ==========================================================
      # 📂 STEP 4 - Repository Contents
      # ==========================================================
      - name: 📂 List repository files
        run: ls -la

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📂 STEP 4 - REPOSITORY CONTENTS"
          echo ""
          echo "El repositorio ya existe dentro del Runner."
          echo "================================================="

      # ==========================================================
      # 🔎 STEP 5 - Verify Terraform
      # ==========================================================
      - name: 🔎 Verify Terraform installation
        run: terraform version

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "🔎 STEP 5 - VERIFY TERRAFORM"
          echo ""
          echo "Terraform respondió correctamente."
          echo "El Runner ya puede ejecutar Terraform."
          echo "================================================="

      # ==========================================================
      # 🧹 STEP 6 - Terraform Format
      # ==========================================================
      #
      # ¿Qué es?
      # terraform fmt
      #
      # ¿Quién lo interpreta?
      # Terraform.
      #
      # ¿Qué hace?
      # Recorre todos los archivos .tf y verifica
      # que tengan el formato oficial de HashiCorp.
      #
      # ¿Habla con Google Cloud?
      # ❌ No.
      #
      # ¿Modifica infraestructura?
      # ❌ No.
      # ==========================================================
      - name: 🧹 Terraform Format Check
        run: terraform fmt -check -recursive terraform/

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "🧹 STEP 6 - TERRAFORM FORMAT"
          echo ""
          echo "Terraform revisó el formato de todos los archivos."
          echo "No habló con Google Cloud."
          echo "No modificó infraestructura."
          echo "================================================="

      # ==========================================================
      # 🏁 STEP 7 - End of Workflow
      # ==========================================================
      - name: 🏁 End of workflow
        run: |
          echo "================================================="
          echo "🎉 FIN DEL PIPELINE"
          echo ""
          echo "Resumen:"
          echo "✔ GitHub interpretó el YAML."
          echo "✔ Creó un Runner."
          echo "✔ El Runner ejecutó checkout."
          echo "✔ Descargó el repositorio."
          echo "✔ Instaló Terraform."
          echo "✔ Verificó el formato del proyecto."
          echo ""
          echo "💥 GitHub destruirá ahora este Runner."
          echo ""
          echo "📚 Próximo capítulo: terraform validate"
          echo "================================================="
