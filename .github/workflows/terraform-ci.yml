name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: 🚀 Terraform Validation
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 👋 STEP 0 - Runner Created
      # ==========================================================
      #
      # ¿Qué acaba de ocurrir?
      #
      # GitHub recibió un Push o Pull Request.
      #
      # Luego interpretó este archivo YAML y creó un
      # GitHub-hosted Runner con Ubuntu.
      #
      # El Runner es una máquina virtual temporal.
      #
      # Estado inicial:
      #
      # ✔ Ubuntu limpio
      # ❌ No existe nuestro repositorio
      # ❌ Terraform no está instalado
      #
      # A partir de ahora GitHub comenzará a ejecutar
      # los Steps definidos más abajo.
      #
      # ==========================================================

      - name: 👋 Welcome to the Runner
        run: |
          echo "================================================="
          echo "🚀 GITHUB ACTIONS TRAINING MODE"
          echo ""
          echo "GitHub interpretó este archivo YAML."
          echo ""
          echo "Después creó un Runner Ubuntu completamente limpio."
          echo ""
          echo "Estado actual:"
          echo "✔ Ubuntu"
          echo "❌ Repositorio"
          echo "❌ Terraform"
          echo ""
          echo "Comencemos a preparar el Runner..."
          echo "================================================="

      # ==========================================================
      # 📥 STEP 1 - Checkout Repository
      # ==========================================================
      #
      # ¿Qué es?
      #
      # Una GitHub Action oficial publicada por GitHub.
      #
      # Owner:
      # actions
      #
      # Repositorio:
      # checkout
      #
      # Versión:
      # v4
      #
      # IMPORTANTE
      #
      # El Runner descarga este repositorio (la Action)
      # y ejecuta el programa que existe dentro.
      #
      # Ese programa tiene una única responsabilidad:
      #
      # Copiar ESTE repositorio (anzy-infrastructure)
      # desde GitHub al workspace del Runner.
      #
      # Sin este Step:
      #
      # ✔ No existiría README.md
      # ✔ No existiría terraform/
      # ✔ No existiría docs/
      #
      # Todos los comandos posteriores fallarían porque
      # el Runner seguiría vacío.
      #
      # ==========================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📥 STEP 1 - CHECKOUT"
          echo ""
          echo "GitHub le dijo al Runner:"
          echo ""
          echo "    Ejecuta actions/checkout@v4"
          echo ""
          echo "El Runner descargó la Action"
          echo "actions/checkout desde GitHub."
          echo ""
          echo "Luego ejecutó el programa que"
          echo "vive dentro de esa Action."
          echo ""
          echo "Ese programa descargó ESTE"
          echo "repositorio al Runner."
          echo ""
          echo "Ahora todos los siguientes Steps"
          echo "pueden trabajar con el código."
          echo "================================================="

      # ==========================================================
      # 📦 STEP 2 - Setup Terraform
      # ==========================================================
      #
      # ¿Qué es?
      #
      # Una GitHub Action oficial mantenida por HashiCorp.
      #
      # Owner:
      # hashicorp
      #
      # Repositorio:
      # setup-terraform
      #
      # Versión:
      # v3
      #
      # El Runner descarga esa Action y ejecuta
      # el programa que contiene.
      #
      # Responsabilidad:
      #
      # Instalar Terraform dentro del Runner.
      #
      # IMPORTANTE
      #
      # Esta Action NO ejecuta Terraform.
      #
      # Solamente deja disponible el comando:
      #
      # terraform
      #
      # para los siguientes Steps.
      #
      # ==========================================================

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📦 STEP 2 - SETUP TERRAFORM"
          echo ""
          echo "GitHub le dijo al Runner:"
          echo ""
          echo "    Ejecuta hashicorp/setup-terraform@v3"
          echo ""
          echo "Terraform quedó instalado."
          echo ""
          echo "Todavía NO ejecutamos Terraform."
          echo "Solo quedó disponible."
          echo "================================================="

      # ==========================================================
      # 📍 STEP 3 - Working Directory
      # ==========================================================

      - name: 📍 Show current directory
        run: pwd

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📍 STEP 3 - WORKING DIRECTORY"
          echo ""
          echo "Todos los comandos 'run:' se ejecutan"
          echo "desde este directorio."
          echo ""
          echo "Aquí fue copiado el repositorio."
          echo "================================================="

      # ==========================================================
      # 📂 STEP 4 - Repository Contents
      # ==========================================================

      - name: 📂 List repository files
        run: ls -la

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📂 STEP 4 - REPOSITORY CONTENTS"
          echo ""
          echo "El repositorio ya existe dentro del Runner."
          echo ""
          echo "README.md"
          echo "terraform/"
          echo "docs/"
          echo ".github/"
          echo ""
          echo "Ahora Terraform podrá trabajar con estos archivos."
          echo "================================================="

      # ==========================================================
      # 🔎 STEP 5 - Verify Terraform
      # ==========================================================

      - name: 🔎 Verify Terraform installation
        run: terraform version

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "🔎 STEP 5 - VERIFY TERRAFORM"
          echo ""
          echo "Terraform respondió correctamente."
          echo ""
          echo "El Runner ya quedó preparado para"
          echo "ejecutar comandos Terraform."
          echo "================================================="

      # ==========================================================
      # 🏁 STEP 6 - End of Workflow
      # ==========================================================

      - name: 🏁 End of workflow
        run: |
          echo "================================================="
          echo "🎉 FIN DEL PIPELINE"
          echo ""
          echo "Resumen:"
          echo ""
          echo "1. GitHub interpretó el YAML."
          echo "2. Creó un Runner Ubuntu."
          echo "3. El Runner ejecutó actions/checkout."
          echo "4. El Runner descargó el repositorio."
          echo "5. El Runner ejecutó setup-terraform."
          echo "6. Terraform quedó instalado."
          echo ""
          echo "💥 Después de este Step GitHub destruirá"
          echo "automáticamente el Runner."
          echo ""
          echo "La próxima ejecución comenzará"
          echo "desde un Runner completamente limpio."
          echo "================================================="