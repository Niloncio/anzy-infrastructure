name: Terraform CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  terraform:
    name: 🚀 Terraform Validation
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 👋 STEP 0 - Runner Created
      # ==========================================================
      #
      # ¿Qué acaba de ocurrir?
      #
      # GitHub recibió un Push o Pull Request.
      #
      # Luego leyó este archivo YAML y creó un
      # GitHub-hosted Runner con Ubuntu.
      #
      # Un Runner es una máquina virtual temporal que ejecutará
      # todos los Steps definidos en este workflow.
      #
      # IMPORTANTE:
      #
      # ✔ El Runner está completamente limpio.
      # ✔ No existe nuestro repositorio.
      # ✔ No existe Terraform.
      # ✔ No existe ninguna herramienta instalada por nosotros.
      #
      # Todo lo prepararemos paso a paso.
      #
      # ==========================================================

      - name: 👋 Welcome to the Runner
        run: |
          echo "================================================="
          echo "🚀 GITHUB ACTIONS TRAINING MODE"
          echo ""
          echo "GitHub interpretó este archivo YAML."
          echo ""
          echo "Después creó un Runner Ubuntu completamente limpio."
          echo ""
          echo "Estado actual:"
          echo "✔ Ubuntu"
          echo "❌ Repositorio"
          echo "❌ Terraform"
          echo "❌ Herramientas del proyecto"
          echo ""
          echo "Ahora comenzaremos a preparar el Runner..."
          echo "================================================="

      # ==========================================================
      # 📥 STEP 1 - Checkout Repository
      # ==========================================================
      #
      # ¿Qué es?
      #
      # Una GitHub Action oficial publicada por GitHub.
      #
      # Owner:
      # actions
      #
      # Repositorio:
      # checkout
      #
      # Versión:
      # v4
      #
      # El Runner descarga esta Action desde GitHub y la ejecuta.
      #
      # ¿Qué responsabilidad tiene?
      #
      # Descargar ESTE repositorio desde GitHub y copiarlo
      # al workspace del Runner.
      #
      # Sin este Step...
      #
      # El Runner seguiría completamente vacío.
      #
      # Los siguientes comandos:
      #
      #   ls
      #   terraform fmt
      #   terraform validate
      #
      # fallarían porque el repositorio no existiría.
      #
      # ==========================================================

      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📥 STEP 1 - CHECKOUT"
          echo ""
          echo "GitHub le indicó al Runner:"
          echo ""
          echo "    Ejecuta actions/checkout@v4"
          echo ""
          echo "El Runner descargó el repositorio."
          echo ""
          echo "Ahora todos los siguientes Steps"
          echo "pueden acceder al código."
          echo "================================================="

      # ==========================================================
      # 📦 STEP 2 - Setup Terraform
      # ==========================================================
      #
      # ¿Qué es?
      #
      # Una GitHub Action oficial mantenida por HashiCorp.
      #
      # Owner:
      # hashicorp
      #
      # Repositorio:
      # setup-terraform
      #
      # Versión:
      # v3
      #
      # El Runner descarga esta Action y la ejecuta.
      #
      # ¿Qué responsabilidad tiene?
      #
      # Instalar Terraform dentro del Runner.
      #
      # IMPORTANTE:
      #
      # Esta Action NO ejecuta Terraform.
      #
      # Solamente lo instala.
      #
      # Sin este Step...
      #
      # terraform version
      #
      # respondería:
      #
      # terraform: command not found
      #
      # ==========================================================

      - name: 📦 Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.12.2"

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📦 STEP 2 - SETUP TERRAFORM"
          echo ""
          echo "GitHub le indicó al Runner:"
          echo ""
          echo "    Ejecuta hashicorp/setup-terraform@v3"
          echo ""
          echo "Terraform quedó instalado."
          echo ""
          echo "Todavía NO hemos ejecutado Terraform."
          echo "Solamente quedó disponible."
          echo "================================================="

      # ==========================================================
      # 📍 STEP 3 - Working Directory
      # ==========================================================
      #
      # Todos los comandos definidos con 'run:'
      # se ejecutan desde el workspace del Runner.
      #
      # ==========================================================

      - name: 📍 Show current directory
        run: pwd

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📍 STEP 3 - WORKING DIRECTORY"
          echo ""
          echo "Este es el directorio desde donde"
          echo "el Runner ejecutará todos los"
          echo "comandos 'run:'."
          echo "================================================="

      # ==========================================================
      # 📂 STEP 4 - Repository Contents
      # ==========================================================

      - name: 📂 List repository files
        run: ls -la

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "📂 STEP 4 - REPOSITORY CONTENTS"
          echo ""
          echo "El repositorio ya existe dentro del Runner."
          echo ""
          echo "README.md"
          echo "terraform/"
          echo "docs/"
          echo ".github/"
          echo ""
          echo "Ya podemos trabajar con el proyecto."
          echo "================================================="

      # ==========================================================
      # 🔎 STEP 5 - Verify Terraform
      # ==========================================================

      - name: 🔎 Verify Terraform installation
        run: terraform version

      - name: 💬 What just happened?
        run: |
          echo "================================================="
          echo "🔎 STEP 5 - VERIFY TERRAFORM"
          echo ""
          echo "Terraform respondió correctamente."
          echo ""
          echo "Eso significa que quedó instalado"
          echo "dentro del Runner."
          echo ""
          echo "El Runner ya está preparado para"
          echo "ejecutar:"
          echo ""
          echo "terraform fmt"
          echo "terraform validate"
          echo "terraform plan"
          echo "terraform apply"
          echo "================================================="

      # ==========================================================
      # 🏁 STEP 6 - End of Workflow
      # ==========================================================
      #
      # Después de este Step...
      #
      # GitHub destruirá automáticamente el Runner.
      #
      # Todo desaparecerá:
      #
      # ✔ Terraform
      # ✔ Repositorio descargado
      # ✔ Archivos temporales
      #
      # La próxima ejecución comenzará nuevamente
      # desde una máquina Ubuntu completamente limpia.
      #
      # ==========================================================

      - name: 🏁 End of workflow
        run: |
          echo "================================================="
          echo "🎉 FIN DEL PIPELINE"
          echo ""
          echo "Resumen:"
          echo ""
          echo "1️⃣ GitHub creó un Runner Ubuntu."
          echo "2️⃣ El Runner descargó el repositorio."
          echo "3️⃣ El Runner instaló Terraform."
          echo "4️⃣ Verificamos que Terraform funciona."
          echo ""
          echo "💥 Después de este Step GitHub destruirá"
          echo "automáticamente el Runner."
          echo ""
          echo "La próxima ejecución comenzará nuevamente"
          echo "desde cero."
          echo "================================================="